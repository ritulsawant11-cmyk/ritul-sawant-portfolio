<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fcaff" />
      <stop offset="100%" stop-color="#a4ffb0" />
    </linearGradient>
  </defs>
  <!-- Gamepad icon -->
  <g transform="translate(4, 10)">
    <rect x="0" y="4" width="34" height="22" rx="7" fill="url(#logoGrad)" />
    <!-- D-pad -->
    <rect x="6" y="12" width="8" height="2.5" rx="1" fill="#22195e" />
    <rect x="9" y="9" width="2.5" height="8" rx="1" fill="#22195e" />
    <!-- Action buttons -->
    <circle cx="24" cy="11" r="1.6" fill="#22195e" />
    <circle cx="28" cy="15" r="1.6" fill="#22195e" />
    <circle cx="20" cy="15" r="1.6" fill="#22195e" />
    <circle cx="24" cy="19" r="1.6" fill="#22195e" />
  </g>
  <!-- Text COMODO -->
  <text x="46" y="32" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="28" letter-spacing="3" fill="#ffffff">
    COMO<tspan fill="url(#logoGrad)">DO</tspan>
  </text>
</svg>