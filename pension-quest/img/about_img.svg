<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 440" width="550" height="440">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fcaff" />
      <stop offset="100%" stop-color="#a4ffb0" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a206b" />
      <stop offset="100%" stop-color="#1b1348" />
    </linearGradient>
  </defs>
  <!-- Background Glow & Grid -->
  <rect x="20" y="20" width="510" height="400" rx="20" fill="url(#boxGrad)" stroke="url(#portalGrad)" stroke-width="2" />
  
  <!-- Cyber Console Screen Frame -->
  <rect x="50" y="50" width="450" height="280" rx="12" fill="#130d35" stroke="#3fcaff" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Holographic Waves -->
  <path d="M 60 220 Q 140 130 220 200 T 380 180 T 490 220" fill="none" stroke="url(#portalGrad)" stroke-width="3" />
  <path d="M 60 240 Q 150 170 240 220 T 400 200 T 490 240" fill="none" stroke="#3fcaff" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Floating VR / Controller Shape -->
  <g transform="translate(180, 100)">
    <rect x="0" y="10" width="190" height="90" rx="24" fill="#2c226e" stroke="url(#portalGrad)" stroke-width="2" />
    <circle cx="55" cy="55" r="22" fill="#17103d" stroke="#3fcaff" stroke-width="2" />
    <circle cx="135" cy="55" r="22" fill="#17103d" stroke="#a4ffb0" stroke-width="2" />
    <path d="M 45 55 L 65 55 M 55 45 L 55 65" stroke="#3fcaff" stroke-width="3" stroke-linecap="round" />
    <circle cx="130" cy="50" r="3" fill="#a4ffb0" />
    <circle cx="140" cy="60" r="3" fill="#a4ffb0" />
  </g>

  <!-- UI Status Elements -->
  <rect x="60" y="70" width="80" height="10" rx="5" fill="#3fcaff" opacity="0.8" />
  <rect x="60" y="90" width="50" height="6" rx="3" fill="#a4ffb0" opacity="0.6" />
  <circle cx="475" cy="75" r="5" fill="#a4ffb0" />
  <circle cx="460" cy="75" r="5" fill="#3fcaff" />
  <circle cx="445" cy="75" r="5" fill="#ffc000" />
  
  <!-- Base Pedestal -->
  <polygon points="120,360 430,360 460,400 90,400" fill="#231a60" stroke="#3fcaff" stroke-width="1" />
  <line x1="160" y1="380" x2="390" y2="380" stroke="url(#portalGrad)" stroke-width="3" />
</svg>